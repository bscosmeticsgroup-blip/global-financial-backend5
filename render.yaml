services:
  - type: web
    name: global-financial-backend5
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WFIRMA_API_URL
        sync: false
      - key: WFIRMA_API_TOKEN
        sync: false
      - key: WFIRMA_API_KEY
        sync: false
